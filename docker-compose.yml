services:
  bone-bot:
    image: bone-bot:latest
    container_name: bone-bot
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # The token itself lives in `secrets/bone_token`, never in the environment
      BONE_TOKEN_FILE: /run/secrets/bone_token
      BONE_DATABASE_URL: "postgresql://bone:${POSTGRES_PASSWORD:-bone}@postgres:5432/bone"
    secrets:
      - bone_token

  postgres:
    image: postgres:18-alpine
    container_name: bone-bot-postgres
    environment:
      POSTGRES_USER: bone
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-bone}"
      POSTGRES_DB: bone
    volumes:
      # 18+ images store data in a version-specific subdirectory
      # (/var/lib/postgresql/18/docker), so the mount goes one level up
      - postgres-data:/var/lib/postgresql
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bone -d bone"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  postgres-data:

secrets:
  bone_token:
    file: ./secrets/bone_token
