[project]
name = "bone-bot"
version = "0.1.0"
description = "The 'bone head' bot for the Dogghouse Discord server."
authors = [
    { name = "Evan Black" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohappyeyeballs==2.7.1",
    "aiohttp==3.14.3",
    "aiosignal==1.4.0",
    "alembic==1.19.1",
    "asyncpg==0.31.0",
    "attrs==26.1.0",
    "audioop-lts==0.2.2",
    "discord-py==2.7.1",
    "frozenlist==1.8.0",
    "greenlet==3.5.5",
    "idna==3.18",
    "loguru==0.7.3",
    "mako==1.4.1",
    "markupsafe==3.0.3",
    "multidict==6.7.1",
    "pillow==12.3.0",
    "propcache==0.5.2",
    "sqlalchemy[asyncio]==2.0.52",
    "typing-extensions==4.16.0",
    "yarl==1.24.5",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
