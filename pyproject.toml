[project]
name = "bone-bot"
version = "0.1.0"
description = "The 'bone head' bot for the Dogghouse Discord server."
authors = [
    { name = "Evan Black" }
]
requires-python = ">=3.13"
dependencies = [
    "aiohappyeyeballs==2.6.1",
    "aiohttp==3.13.0",
    "aiosignal==1.4.0",
    "attrs==25.4.0",
    "audioop-lts==0.2.2",
    "discord-py==2.6.4",
    "frozenlist==1.8.0",
    "idna==3.11",
    "loguru==0.7.3",
    "multidict==6.7.0",
    "pillow==12.0.0",
    "propcache==0.4.1",
    "yarl==1.22.0",
]

[dependency-groups]
dev = [
    "ruff>=0.16.1",
]

[tool.ruff]
target-version = "py313"
line-length = 120

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]

[tool.ruff.format]
quote-style = "double"
